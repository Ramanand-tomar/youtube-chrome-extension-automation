name: Reel Automation & CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      run_transformation_test:
        description: 'Run automated video transformation test'
        required: false
        type: boolean
        default: true
  schedule:
    # Runs every 6 hours automatically (optional automated reel workflow)
    - cron: '0 */6 * * *'

jobs:
  # ─── 1. Build & Test Video Engine ───────────────────────────────────────────
  test-backend:
    name: Test Backend & FFmpeg Engine
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install FFmpeg & System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verify FFmpeg Installation
        run: ffmpeg -version

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci || npm install

  # ─── 2. Package Chrome Extension ────────────────────────────────────────────
  package-extension:
    name: Package Chrome Extension Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Extension Zip
        run: |
          mkdir -p dist
          zip -r dist/chrome-extension-youtube-uploader.zip extension/ -x "*.DS_Store"

      - name: Upload Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension-build
          path: dist/chrome-extension-youtube-uploader.zip
          retention-days: 30

  # ─── 3. Automated Reel Transformation Job (Runs on Schedule or Manual Trigger) ──────
  scheduled-reel-transformation:
    name: Run Automated Reel Transformation Pipeline
    if: github.event_name == 'schedule' || github.event.inputs.run_transformation_test == 'true'
    runs-on: ubuntu-latest
    needs: test-backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci || npm install

      - name: Execute Reel Transformation Pipeline
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REDIRECT_URI: ${{ secrets.YOUTUBE_REDIRECT_URI }}
        run: |
          echo "Starting automated Reel Transformation workflow on GitHub Runner..."
          node -e "
            const transformer = require('./backend/utils/videoTransformer');
            console.log('Video Transformer module verified on GitHub Runner.');
            console.log('Available Presets:', Object.keys(transformer.PRESETS));
          "
